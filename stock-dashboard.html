async function initLadderView() {
  ladderState.initialized = true;
  setLadderMessage('正在加载历史日期…');
  try {
    var response = await dashboardFetch(LADDER_DATES_API, { cache: 'no-store' });
    if (!response.ok) throw new Error(await getApiError(response, '无法读取历史日期'));
    var data = await response.json();
    ladderState.dates = Array.isArray(data.dates) ? data.dates : [];
  } catch (e) {
    setLadderMessage(e.message || '无法读取历史日期', true);
    renderLadderEmpty('历史数据不可用');
    return;
  }
  if (!ladderState.dates.length) {
    setLadderMessage('暂无历史数据，请先导入或等待每日自动积累');
    renderLadderEmpty('暂无历史数据');
    return;
  }
  var savedDate = null;
  try {
    savedDate = localStorage.getItem(LADDER_DATE_KEY) || null;
    var savedTier = parseInt(localStorage.getItem(LADDER_TIER_KEY) || '', 10);
    ladderState.selectedStreak = Number.isFinite(savedTier) && savedTier >= 1 ? savedTier : null;
  } catch (e) {}
  var target = (savedDate && ladderState.dates.indexOf(savedDate) !== -1)
    ? savedDate
    : ladderState.dates[ladderState.dates.length - 1];
  await loadLadderDate(target);
}

function setLadderMessage(text, isError) {
  var elMsg = document.getElementById('ladderMessage');
  elMsg.textContent = text || '';
  elMsg.className = isError ? 'error' : '';
}

function renderLadderEmpty(text) {
  document.getElementById('tierCards').innerHTML = '';
  var tbody = document.getElementById('ladderTableBody');
  tbody.innerHTML = '';
  var tr = el('tr');
  var td = el('td', 'detail-empty-cell', text);
  td.colSpan = 5;
  tr.appendChild(td);
  tbody.appendChild(tr);
}

async function loadLadderDate(dateStr, options) {
  options = options || {};
  var requestId = ++ladderState.requestId;
  if (!options.silent) setLadderMessage('加载中…');
  var data;
  try {
    var response = await dashboardFetch(LADDER_HISTORY_API + '?date=' + encodeURIComponent(dateStr), { cache: 'no-store' });
    if (!response.ok) throw new Error(await getApiError(response, '无法读取历史数据'));
    data = await response.json();
  } catch (e) {
    if (requestId !== ladderState.requestId) return;
    setLadderMessage(e.message || '无法读取历史数据', true);
    scheduleLadderPoll();
    return;
  }
  if (requestId !== ladderState.requestId) return; // 防止旧请求覆盖新日期结果
  ladderState.date = dateStr;
  ladderState.data = data;
  try { localStorage.setItem(LADDER_DATE_KEY, dateStr); } catch (e) {}
  var tiers = Array.isArray(data.tiers) ? data.tiers : [];
  var streaks = tiers.map(function(t) { return t.streak; });
  if (ladderState.selectedStreak === null || streaks.indexOf(ladderState.selectedStreak) === -1) {
    // 默认选中最高板位（情绪焦点）；无数据时不选中
    ladderState.selectedStreak = streaks.length ? streaks[streaks.length - 1] : null;
  }
  renderLadderDateBar();
  renderTierCards();
  renderLadderTable();
  setLadderMessage('');
  scheduleLadderPoll();
}

function renderLadderDateBar() {
  var dates = ladderState.dates;
  var index = dates.indexOf(ladderState.date);
  var select = document.getElementById('ladderDateSelect');
  select.innerHTML = '';
  for (var i = dates.length - 1; i >= 0; i--) {
    var option = document.createElement('option');
    option.value = dates[i];
    option.textContent = formatLadderDate(dates[i]);
    if (dates[i] === ladderState.date) option.selected = true;
    select.appendChild(option);
  }
  document.getElementById('ladderPrevBtn').disabled = index <= 0;
  document.getElementById('ladderNextBtn').disabled = index < 0 || index >= dates.length - 1;
  document.getElementById('ladderLatestBtn').disabled = !dates.length || ladderState.date === dates[dates.length - 1];

  var statusEl = document.getElementById('ladderStatus');
  var status = ladderState.data && ladderState.data.status;
  if (status === 'final') { statusEl.textContent = '收盘定版'; statusEl.className = 'final'; }
  else if (status === 'live') { statusEl.textContent = '盘中更新'; statusEl.className = 'live'; }
  else { statusEl.textContent = '待确认'; statusEl.className = 'pending'; }
}

function tierRateText(tier, status) {
  if (status === 'pending') return { text: '晋级率 待确认', na: true };
  if (tier.evaluable > 0 && tier.rate !== null && tier.rate !== undefined) {
    return { text: '晋级率 ' + tier.rate.toFixed(2) + '% · ' + tier.promoted + '/' + tier.evaluable, na: false };
  }
  return { text: '晋级率 --', na: true };
}

function renderTierCards() {
  var container = document.getElementById('tierCards');
  container.innerHTML = '';
  var data = ladderState.data;
  var tiers = data && Array.isArray(data.tiers) ? data.tiers : [];
  if (!tiers.length) {
    renderLadderEmpty('该交易日没有涨停梯队数据');
    return;
  }
  for (var i = 0; i < tiers.length; i++) {
    (function(tier) {
      var card = el('button', 'tier-card' + (tier.streak === ladderState.selectedStreak ? ' selected' : ''));
      card.type = 'button';
      card.setAttribute('aria-pressed', tier.streak === ladderState.selectedStreak ? 'true' : 'false');
      card.setAttribute('aria-label', boardName(tier.streak) + '，' + tier.count + ' 只');
      card.appendChild(el('span', 'tier-name', boardName(tier.streak)));
      card.appendChild(el('span', 'tier-count', tier.count + ' 只'));
      var rateInfo = tierRateText(tier, data.status);
      card.appendChild(el('span', 'tier-rate' + (rateInfo.na ? ' na' : ''), rateInfo.text));
      card.addEventListener('click', function() {
        selectLadderTier(tier.streak);
      });
      container.appendChild(card);
    })(tiers[i]);
  }
}

function selectLadderTier(streak) {
  ladderState.selectedStreak = streak;
  try { localStorage.setItem(LADDER_TIER_KEY, String(streak)); } catch (e) {}
  renderTierCards();
  renderLadderTable();
}

function promotionDisplay(promotion) {
  if (promotion === 'yes') return { text: '是', cls: 'promotion-yes' };
  if (promotion === 'no') return { text: '否', cls: 'promotion-no' };
  if (promotion === 'unknown') return { text: '不可评估', cls: 'promotion-unknown' };
  return { text: '待确认', cls: 'promotion-pending' };
}

function renderLadderTable() {
  var tbody = document.getElementById('ladderTableBody');
  tbody.innerHTML = '';
  var data = ladderState.data;
  var stocks = data && Array.isArray(data.stocks) ? data.stocks : [];
  var selected = stocks.filter(function(s) { return s.streak === ladderState.selectedStreak; });
  if (!selected.length) {
    if (stocks.length && ladderState.selectedStreak === null) {
      renderLadderEmpty('请选择上方梯队卡片查看个股明细');
    }
    return;
  }
  for (var i = 0; i < selected.length; i++) {
    var stock = selected[i];
    var tr = el('tr');
    tr.appendChild(setColumn(el('td', 'col-code', stock.code), 'code'));
    var nameTd = el('td', 'col-stock-name');
    var nameSpan = el('span', 'stock-name-text', stock.name);
    nameSpan.title = stock.name;
    nameTd.appendChild(nameSpan);
    tr.appendChild(nameTd);
    var promotion = promotionDisplay(stock.promotion);
    tr.appendChild(el('td', 'col-num ' + promotion.cls, promotion.text));
    var close = typeof stock.close === 'number' ? stock.close.toFixed(2) : '--';
    tr.appendChild(el('td', 'col-num', close));
    var pct = typeof stock.changePct === 'number' ? stock.changePct : null;
    tr.appendChild(el('td', 'col-num ' + getValClass(pct), pct !== null ? formatPct(pct) : '--'));
    tbody.appendChild(tr);
  }
}

function stopLadderPoll() {
  if (ladderPollTimer) { clearTimeout(ladderPollTimer); ladderPollTimer = null; }
}

function scheduleLadderPoll() {
  stopLadderPoll();
  if (currentView !== 'ladder' || document.hidden || !ladderState.data) return;
  var status = ladderState.data.status;
  // 收盘定版的历史日期无需轮询；盘中/待确认状态跟随实时行情刷新
  if (status !== 'live' && status !== 'pending') return;
  if (!Core.isPollingWindow(Date.now()) && status === 'live') return;
  ladderPollTimer = setTimeout(function() {
    ladderPollTimer = null;
    if (currentView !== 'ladder' || document.hidden || !ladderState.date) return;
    loadLadderDate(ladderState.date, { silent: true });
  }, REFRESH_INTERVAL);
}

document.getElementById('liveViewBtn').addEventListener('click', function() { setView('live'); });
document.getElementById('ladderViewBtn').addEventListener('click', function() { setView('ladder'); });
document.getElementById('ladderPrevBtn').addEventListener('click', function() {
  var index = ladderState.dates.indexOf(ladderState.date);
  if (index > 0) loadLadderDate(ladderState.dates[index - 1]);
});
document.getElementById('ladderNextBtn').addEventListener('click', function() {
  var index = ladderState.dates.indexOf(ladderState.date);
  if (index >= 0 && index < ladderState.dates.length - 1) loadLadderDate(ladderState.dates[index + 1]);
});
document.getElementById('ladderLatestBtn').addEventListener('click', function() {
  if (ladderState.dates.length) loadLadderDate(ladderState.dates[ladderState.dates.length - 1]);
});
document.getElementById('ladderDateSelect').addEventListener('change', function(e) {
  if (e.target.value) loadLadderDate(e.target.value);
});

// ==================== 初始化 ====================
async function init() {
  setSaveStatus('正在加载清单', 'saving');
  try {
    await loadState();
  } catch (e) {
    poolStorageBlocked = true;
    setSaveStatus('清单读取失败', 'error');
    showStorageError(e.message || '无法读取个股池文件');
  }
  loadColumnOrders();
  loadPoolFilters();
  setupColumnDragging('poolTable');
  setupColumnDragging('detailTable');
  updateSortHeaders();
  updateDetailSortHeaders();
  updateMarketStatus();
  if (state.pools.length > 0) showSkeleton();
  else renderTable();
  renderDetailPanel(state.currentPoolId);
  refreshQuotes('initial');
  startAutoRefresh();
  startPoolFileSync();
  var savedView = 'live';
  try { savedView = localStorage.getItem(VIEW_KEY) || 'live'; } catch (e) {}
  if (savedView === 'ladder') setView('ladder');
}
init();
</script>
</body>
</html>
